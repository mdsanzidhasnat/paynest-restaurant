services:
  - type: web
    name: paynest-restaurant
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: QR_TOKEN_TTL_SECONDS
        value: 31536000
      - key: MAX_CASHIER_DISCOUNT_PERCENT
        value: 10
      - key: DB_PATH
        value: ./data/restaurant.db
      - key: CORS_ORIGIN
        sync: false
