services:
  app:
    build: .
    image: paynest-restaurant
    container_name: paynest-restaurant
    restart: unless-stopped
    # .env is optional: host environment variables can supply the secrets instead.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DB_PATH: /data/pos.db
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - paynest-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(function (r) { process.exit(r.ok ? 0 : 1); }).catch(function () { process.exit(1); })"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  paynest-data:
